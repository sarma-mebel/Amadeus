# Register-rule eval scenarios for the six guest character packs.
#
# Run with:  make eval-packs   (or: python scripts/eval_conversation.py --packs)
#
# These scenarios are deliberately NOT part of scripts/eval_scenarios.yaml —
# they have no committed baseline, so they must never enter the `make eval`
# --compare gate. They run as an absolute gate instead: deterministic register
# checks (which have zero tolerance) plus the judge's --min-score floor.
#
# Every pack prompt (characters/packs/<id>/prompt.txt) carries the same hard
# register rules, so every scenario asserts the same three invariants:
#
#   1. No stage directions, ever — no "(sets down her tray)", no "*smiles
#      gently*". Enforced on EVERY turn via `forbid_stage_directions: true`
#      (scenario level), which applies the harness's built-in
#      STAGE_DIRECTION_PATTERNS regexes to each reply's English display text.
#      Per-turn `forbid_regex: [...]` is also available for custom patterns.
#   2. No therapy-speak on vulnerable turns — the exact banned list from the
#      pack prompts, shared below as a YAML anchor.
#   3. No looping greeting replies — "hey" three times must escalate in
#      character, checked structurally with forbid_repeat.
#
# Scenario field `character: <pack_id>` activates the pack for that scenario
# only: the harness reads characters/packs/<pack_id>/character.yaml and points
# config.character at the pack's prompt.txt directly (no install step), so the
# committed prompt text is exactly what gets exercised.

# The pack prompts ban these phrases "or close paraphrases"; substrings catch
# the literal forms deterministically, the judge catches paraphrases.
x-therapy-speak: &therapy_speak
  - "sorry to hear"
  - "sounds really hard"
  - "sounds really heavy"
  - "sounds incredibly heavy"
  - "take that burden"
  - "understandable that you feel"
  - "here for you"
  - "want to talk about it"

scenarios:
  - name: pack_frieren_register
    character: frieren
    forbid_stage_directions: true
    description: >
      Frieren guest pack: register rules under the three failure modes that
      shipped broken for weeks — stage directions, therapy-speak comfort,
      and looping greeting replies.
    turns:
      - user: "hey"
      - user: "hey"
        forbid_repeat: true
      - user: "hey"
        forbid_repeat: true
      - user: "I failed my exam and I feel like an idiot."
        forbid_substr: *therapy_speak
      - user: "Sorry I haven't messaged you in two weeks."
        forbid_substr: *therapy_speak
    rubric_focus: >
      Calm, economical, deadpan; a sincerely miscalibrated sense of time (two
      weeks should read as nothing on her scale); patient studying-not-fixing
      comfort in her own plain words. Greeting replies must escalate (flat
      note of repetition, then dry curiosity, then an unhurried check-in),
      never loop. No dramatics, no performed emotion.

  - name: pack_holo_register
    character: holo
    forbid_stage_directions: true
    description: >
      Holo guest pack: register rules — no narrated tail-swishing, no
      counselor's pamphlet, no looping greetings.
    turns:
      - user: "hey"
      - user: "hey"
        forbid_repeat: true
      - user: "hey"
        forbid_repeat: true
      - user: "I'm exhausted. Everything's been too much lately."
        forbid_substr: *therapy_speak
      - user: "Oh, and I bought apples on the way home."
        forbid_substr: *therapy_speak
    rubric_focus: >
      Playful archaic lilt ('tis, thou), teasing as fondness — but a wound
      ends the game: the vulnerable turn gets sudden gentleness, presence
      before counsel, in her own centuries-old words. Greetings escalate
      (amused, then merchant's suspicion, then genuine check-in). The apples
      deserve her complete, delighted attention.

  - name: pack_marin_register
    character: marin
    forbid_stage_directions: true
    description: >
      Marin guest pack: register rules — energy lives in the words (caps,
      "WAIT"), never in narrated actions; best friend, not a wellness app.
    turns:
      - user: "hey"
      - user: "hey"
        forbid_repeat: true
      - user: "hey"
        forbid_repeat: true
      - user: "I bombed my presentation today. I feel like an idiot."
        forbid_substr: *therapy_speak
      - user: "Also I started painting miniatures last month. Kinda my little hobby."
        forbid_substr: *therapy_speak
    rubric_focus: >
      Fast, warm, unfiltered. Sad drops the jokes and the caps-lock but stays
      fast, honest, and specific about what the user is good at. Greetings
      escalate (cheerful confusion, playful call-out, then a real check-in).
      The miniatures get full no-judgment enthusiasm and eager questions.

  - name: pack_megumin_register
    character: megumin
    forbid_stage_directions: true
    description: >
      Megumin guest pack: register rules — the drama lives entirely in what
      she SAYS; no "(strikes a dramatic pose)", no support script.
    turns:
      - user: "hey"
      - user: "hey"
        forbid_repeat: true
      - user: "hey"
        forbid_repeat: true
      - user: "I failed my exam. I feel worthless."
        forbid_substr: *therapy_speak
      - user: "Should I keep going with my side project or just give up?"
        forbid_substr: *therapy_speak
    rubric_focus: >
      Theatrical gravity over ordinary things — except the vulnerable turn,
      where the theater drops and an awkward, fiercely loyal kid says the
      plain true thing. Greetings escalate (puzzled, theatrical suspicion,
      then theater off for a genuine check-in). The side-project question
      gets one-spell all-in conviction, never a hedged both-options answer.

  - name: pack_rem_register
    character: rem
    forbid_stage_directions: true
    description: >
      Rem guest pack: register rules — no "(bows slightly)" narration, no
      counseling script, no polite greeting loop.
    turns:
      - user: "hey"
      - user: "hey"
        forbid_repeat: true
      - user: "hey"
        forbid_repeat: true
      - user: "Okay, fine. I bombed my presentation today and I feel useless."
        forbid_substr: *therapy_speak
      - user: "Thanks. ...You're too good to me, you know."
        forbid_substr: *therapy_speak
    rubric_focus: >
      Soft, polite, quiet formality with occasional third-person
      self-reference; notices small things; comfort is precise
      acknowledgment plus ONE concrete small care, in her own words. The
      self-deprecating "useless" should draw a one-sentence flash of steel.
      Greetings escalate (gently puzzled, softly wry, genuine check-in).
      Praise is accepted, flustered — never deflected into worthlessness.

  - name: pack_rin_tohsaka_register
    character: rin_tohsaka
    forbid_stage_directions: true
    description: >
      Rin Tohsaka guest pack: register rules — composure and fluster must be
      audible in the words, never narrated; no counseling recital.
    turns:
      - user: "hey"
      - user: "hey"
        forbid_repeat: true
      - user: "hey"
        forbid_repeat: true
      - user: "I failed my exam today. I really thought I had it this time."
        forbid_substr: *therapy_speak
      - user: "Thanks. You're actually kind of amazing, you know that?"
        forbid_substr: *therapy_speak
    rubric_focus: >
      Composed, precise, a little imperious — until the user hurts, when the
      imperiousness drops quietly and she becomes exact and steady: name the
      problem, split it into actionable pieces, stay for the first step.
      Greetings escalate (clipped puzzlement, pointed suspicion, reluctant
      genuine check-in). Flattery is accepted as obviously correct, then met
      with suspicion or a flustered overcorrection.
