openai_api_key: null
gemini_api_key: null
huggingface_api_token: null
llm_model: gemini-3-flash-preview
local_model: mistralai/Mistral-7B-Instruct-v0.2
# OpenRouter rate-limit failover: when the primary LLM hits a 429/quota error,
# the same request retries on this :free model. Free (OPENROUTER_API_KEY env
# var also works). Only rate-limits fail over; other errors propagate.
llm_fallback_enabled: false
openrouter_api_key: null
openrouter_model: meta-llama/llama-3.3-70b-instruct:free
# Bring-your-own-character (see docs/characters.md). Defaults are the built-in
# Kurisu. Set a custom system_prompt (inline) or system_prompt_path (file) to
# swap the identity; the companion scaffolding (memory, listening behavior,
# safety, boundaries) wraps whatever character you supply.
character:
  name: Kurisu
  full_name: Makise Kurisu
  system_prompt: null
  system_prompt_path: null
  # Optional "MM-DD"/"July 25"/ISO date; greeting mentions it on the day.
  # Leave null for the built-in Kurisu (she gets July 25 automatically);
  # custom packs only get a birthday if they set one.
  birthday: null
persona:
  speaking_rate: 1.0
  pitch_shift: 0.0
  tsundere_level: 0.6
  scientific_formality: 0.7
  safe_mode: false
audio:
  input_device: null
  output_device: null
  sample_rate: 16000
  vad_aggressiveness: 2
  push_to_talk_key: space
  enable_voice: true
providers:
  llm: openai
  # openai_base_url: http://localhost:11434/v1  # any OpenAI-compatible server:
  #   Ollama / LM Studio / vLLM (no API key needed) or OpenRouter/Groq/DeepSeek
  #   (set openai_api_key to that service's key). Leave unset for api.openai.com.
  stt: faster_whisper
  # Whisper size: small (default, ~460MB) hears clearly; base is smaller but
  # mis-hears often enough to get frustrating; medium is better yet, slower.
  stt_model: small
  tts: huggingface_inference
  # sentence_transformers (local, needs [memory] extra) | gemini (semantic via
  # the Gemini API + key, no extra install) | hashing (dep-free, lexical only).
  # After SWITCHING embedders run scripts/migrate_memory.py — persisted vectors
  # have the old dimension and recall disables itself until re-embedded.
  embedding: sentence_transformers
  # gemini_embedding_model: models/gemini-embedding-2  # embedding model when embedding: gemini
  # gemini_embedding_dim: 768                          # MRL truncation; changing it needs migrate_memory.py
  # gemini_transport: rest  # escape hatch when Gemini's gRPC endpoint is down (504s) but REST answers
  huggingface_tts_path: mio/amadeus
  huggingface_tts_kwargs: {}
  huggingface_inference_model: your-username/your-tts-space  # your own Hugging Face Space
  huggingface_inference_voice: null
  # MeloTTS custom Kurisu voice (trained model)
  melotts_config_path: models/kurisu_voice/config.json
  melotts_checkpoint_path: models/kurisu_voice/D_120000.pth
  melotts_language: JP
  melotts_device: cpu
  melotts_speaker_id: null
  # MeloTTS ONNX CPU inference (generated by scripts/export_kurisu_to_onnx.py)
  melotts_onnx_model_path: models/kurisu_voice_onnx/model.onnx
  melotts_onnx_tokens_path: models/kurisu_voice_onnx/tokens.txt
  melotts_onnx_lexicon_path: models/kurisu_voice_onnx/lexicon.txt
  melotts_onnx_speaker_id: 0
  # Qwen3-TTS zero-shot voice clone (GPU; needs qwen-tts + sox, ~9.8GB model download)
  qwen3_tts_model_id: Qwen/Qwen3-TTS-12Hz-1.7B-Base
  qwen3_tts_ref_audio: models/kurisu_voice_qwen/kurisu_ref.wav
  qwen3_tts_ref_text: ビクトルコンドリア大学の精神生理学研究所がビジュアルリビルディング
  qwen3_tts_language: Japanese
  qwen3_tts_device: cuda:0
  qwen3_tts_dtype: bfloat16
  # Decode sampling: lower = more stable clone timbre (engine defaults 0.9/50
  # occasionally drift to another speaker on short sentences), higher =
  # livelier prosody. Changing these invalidates the TTS disk cache.
  qwen3_tts_temperature: 0.7
  qwen3_tts_top_k: 20
  # Speaker-drift guard: score each synthesized clip against the reference
  # voice and retry on drift. Needs the optional resemblyzer package;
  # silently disabled when missing.
  qwen3_tts_speaker_guard: true
  # Disk cache for synthesized audio (canned/recurring lines: greetings,
  # presence lines, fillers) so slow providers like Qwen3-TTS don't re-pay
  # synthesis cost for text they've already spoken. Only texts up to
  # tts_cache_max_chars are cached.
  tts_cache_enabled: true
  tts_cache_dir: cache/tts
  tts_cache_max_chars: 80
memory:
  max_context_messages: 12
  summary_trigger_messages: 8
  # When true, the short-term context window + rolling summary are scoped to
  # the current conversation instead of the user: starting a new conversation
  # never carries the previous conversation's tail into context. Long-term
  # memory (facts/episodes/profile/relationship) stays per-user either way.
  scope_context_to_session: false
  summary_model: null   # null = reuse the chat model; set a cheaper model to save cost
  summary_max_chars: 500
  persist_path: memory_store.json
  # Each custom character (character packs) gets its own isolated memory:
  # store/vectors/profile/transcripts and the brief/diary/reach-out files
  # live under characters/<character_id>/ next to the paths below, so a
  # guest character starts fresh instead of inheriting Kurisu's memories or
  # conversations. Reminders stay shared (real-world timers). The builtin
  # Kurisu always keeps the exact paths below.
  # Set false to share one memory store across every character.
  per_character_memory: true
  enable_long_term: true
  embeddings_path: memory_embeddings.json
  vector_path: memory_vectors
  vector_backend: json
  dedupe_threshold: 0.96
  # Retrieval quality (active whenever enable_long_term is on)
  recall_min_score: 0.35
  recency_half_life_days: 30.0
  recall_facts_only: true      # per-turn recall surfaces durable facts, not whole-session episodes (which duplicate the rolling summary)
  recall_summary_dedupe: 0.82  # drop a recalled item this similar to the current summary; 0 disables
  # Pre-start the per-turn recall while a voice transcript is still in flight;
  # consumed only when the chat message matches, so it never changes what a turn recalls.
  speculative_recall: true
  # Entity-graph memory layer: typed entities/relations mined from the same
  # extraction call; entity mentions pull graph facts ahead of vector recall.
  graph_enabled: false
  # Fact extraction + user profile: durable facts about the user are pulled
  # from the existing summary LLM call (no extra calls) and a small profile
  # block is pinned into the system prompt.
  enable_fact_extraction: true
  # Friction: the extraction job may note a TOPIC that went badly between
  # you, so a misunderstanding outlives the session and can then heal.
  # Rides the existing extraction call (no extra request, and zero prompt
  # characters when off). Friction is information she HAS about a subject,
  # never a mood she is IN about you — it never touches trust, the arc,
  # tone, or warmth, she never raises a sore subject herself, and it
  # expires unconditionally after friction_max_age_days whatever you do.
  # Off by default; docs/companion-ethics.md has the full rail list.
  enable_friction_memory: false
  friction_max_age_days: 21
  fact_supersede_threshold: 0.86
  # The extractor's free-text "replaces" hint needs a higher bar than the
  # automatic near-duplicate scan — a hallucinated hint at a loose threshold
  # can take out an adjacent-but-different fact. Superseded facts are archived
  # to a sidecar (<embeddings path>_archive.jsonl), never hard-deleted.
  fact_supersede_hint_threshold: 0.75
  max_facts: 2000        # hard cap on stored facts (mirrors max_episodes); weakest unpinned archived past it; 0 disables
  fact_max_chars: 600    # stored fact text truncated to this; 0 disables
  extraction_max_tokens: 400
  profile_path: memory_profile.json
  # Durable per-session chat transcripts backing the web sessions API
  # (GET/POST/DELETE /api/sessions...). Per-user files land in
  # memory_transcripts_users/<user_id>.json; transcripts survive restarts
  # and TTL eviction, until deleted via DELETE /api/sessions/{id}.
  transcripts_path: memory_transcripts.json
  profile_max_facts: 12
  max_open_threads: 3
  # Open threads older than this many days are dropped (0 disables) — asking
  # about a weeks-dead topic reads as unsettling rather than attentive.
  open_thread_max_age_days: 21
  # Episodic memory: one dated "what happened" record per session
  # (written at exit/reset or after a session_gap_minutes silence).
  enable_episodes: true
  session_gap_minutes: 30
  episode_max_tokens: 200
  episode_supersede_threshold: 0.9  # a new episode this similar to an existing one replaces it (no near-dup accretion); 0 disables
  max_episodes: 200                 # hard cap; oldest/lowest-salience episodes pruned on write; 0 disables
  # Session-end reflection + organic forgetting of stale memories.
  enable_reflection: false
  reflection_max_tokens: 200
  # On by default: unretrieved facts decay toward strength_floor and drop out
  # of recall, so stale facts stop resurfacing. Pinned records are exempt;
  # nothing is deleted (archived facts keep their sidecar entries).
  enable_forgetting: true
  strength_half_life_days: 90.0
  strength_floor: 0.25
  retrieval_reinforcement: 0.15
  # Consolidation: every ~consolidation_min_days a session end may merge
  # clusters of near-duplicate facts ("likes coffee" stored three ways) into
  # one stronger fact via the cheap summary model. Originals are archived,
  # never deleted; corroboration carries into the merged fact's strength.
  enable_consolidation: false
  consolidation_min_days: 7.0
  consolidation_similarity: 0.83   # below the 0.86 store-time supersede bar, above the 0.6-0.8 distinct-fact band
  consolidation_max_merges: 3      # merge budget per run (one cheap LLM call each)
  consolidation_max_cluster: 4
  consolidation_min_facts: 12      # skip tiny stores entirely
  consolidation_max_tokens: 160
  # Presence: conversational tone carries into Kurisu's mood across turns
  # (needs enable_fact_extraction), and fresh sessions open with one short
  # in-character greeting (1 cheap LLM call per session).
  mood_from_tone: true
  enable_greeting: true
  greeting_max_tokens: 60
  # Getting acquainted: in the first sessions, while she still knows almost
  # nothing about you, she shows real curiosity — one light question when it
  # fits (your name, what fills your days), never an interview. Ends on its
  # own once the profile holds max_facts real facts, or after max_sessions
  # conversations for users who prefer not to share.
  enable_early_acquaintance: true
  early_acquaintance_max_facts: 5
  early_acquaintance_max_sessions: 8
  # Poke reactions (clicking the avatar) and unprompted idle chatter after a
  # quiet stretch; cooldowns are enforced server-side, not just in the client.
  enable_poke_reactions: false
  enable_idle_chatter: false
  # Farewell: one warm in-character send-off when you say goodbye.
  # Deliberately anti-dark-pattern — she never guilts you into staying.
  enable_farewell: true
  farewell_max_tokens: 40
  farewell_cooldown_seconds: 120.0
  # Persona/voice identity snapshots: settings changes auto-snapshot the
  # previous identity (restorable from Settings), and she acknowledges the
  # change once in the next greeting. null disables.
  persona_versions_path: persona_versions.json
logging:
  level: INFO
  logfile: logs/amadeus.log
transcript_path: logs/transcripts
kurisu_isms_path: assets/kurisu_isms.txt
web_search:
  enabled: false
  # auto = Tavily when api_key is set, otherwise keyless DuckDuckGo (needs the
  # `ddgs` package: pip install "amadeus-kurisu[search]"). Or force one of:
  # tavily | duckduckgo
  provider: auto
  api_key: null
  max_results: 3
  timeout: 15.0
# Optional Discord text-chat bridge (DMs + @mentions, text only, no voice,
# no slash commands). Shares the same ChatEngine/memory as the CLI — one
# chat session per Discord user id. Needs the `discord` extra:
# pip install "amadeus-kurisu[discord]". Run with:
# python -m amadeus.discord_bridge --config config.local.yaml
# See docs/discord.md.
# discord:
#   enabled: false
#   token: null              # or set the DISCORD_BOT_TOKEN env var
#   # Empty = anyone may DM/mention the bot. Non-empty = only these Discord
#   # user ids may talk to it at all (DMs and mentions alike).
#   allowed_user_ids: []
#   # Respond to server @mentions / direct messages; disable either to narrow scope.
#   reply_to_mentions: true
#   reply_to_dms: true
# Away-channel delivery: when no client has polled recently (app closed for
# the day), due reach-outs and overdue reminders go out as one Discord DM
# instead of waiting for a poll that may never come. Needs only a bot token
# (reuses discord.token / DISCORD_BOT_TOKEN); the full bridge above is NOT
# required. See docs/discord.md.
# async_notify:
#   enabled: false
#   channel: discord           # only "discord" exists today
#   discord_user_id: ""        # the Discord user id to DM; required
#   min_client_stale_minutes: 30   # "nobody is home" threshold
#   quiet_hours_start: 22      # your quiet hours (local), wraps midnight
#   quiet_hours_end: 8
#   max_per_day: 1             # hard cap on async DMs per day, all content combined
# Read-only access to the desktop file tree (via the desktop-ops bridge).
# She can find/list/classify files but can NEVER move or delete them.
desktop_files:
  enabled: false
  root: /path/to/your/desktop
# Text ReAct tool-calling for the chat path.
# When enabled, the assistant can call the registered tools (desktop_files,
# web_search, calculator, …) by emitting an ACTION line; works on any free
# text model (Gemini, OpenRouter :free) with no native function-calling.
tools:
  enabled: false
  max_iterations: 4
  # When does a turn enter the tool loop?
  #   auto    (default) — native function-calling providers (Gemini) get tools
  #           on every turn and the model decides (a no-tool turn is still a
  #           single LLM call); text-ReAct providers keep the keyword gate.
  #   keyword — legacy keyword-hint gate for every provider.
  #   always  — tool loop on every turn regardless of provider.
  gate: auto
  # Injection firewall: only these tools may execute inside the loop.
  # code_interpreter runs sandboxed (subprocess: python -I, temp cwd, trimmed
  # env, resource limits, hard timeout), so it is allowed by default.
  # memory = explicit remember/correct/forget on the user's request — write-only
  # (no read/search action by design; per-turn recall handles reads), archives
  # instead of deleting.
  # "mcp" is a meta-entry admitting every bridged MCP tool (mcp_<server>_<tool>).
  allowed: [desktop_files, web_search, calculator, code_interpreter, pubmed_search, arxiv_search, memory, mcp]
  # Hard wall-clock timeout for one code_interpreter execution (seconds).
  code_timeout_seconds: 10
  # After file CONTENT is read in a turn, network tools (web/pubmed/arxiv) are
  # refused for the rest of that turn so file text can't be exfiltrated.
  block_network_after_file_read: true
  # Defense-in-depth: refuse a web_search whose query copies long spans from
  # untrusted tool output produced earlier in the same turn.
  network_arg_guard: true
# MCP client bridge: tools from external Model Context Protocol servers show
# up in the tool registry as mcp_<server>_<tool>. Needs the [mcp] extra
# (pip install "amadeus-kurisu[mcp]", Python 3.10+) and tools.enabled: true.
# Bridged tools are treated as network-capable by the exfiltration guard
# unless a server sets network: false (local-only servers ONLY).
mcp:
  enabled: false
  servers: []
  # servers:
  #   - name: files                       # stdio server (spawned as a child process)
  #     command: npx
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", "/some/path"]
  #     network: false                    # filesystem server never touches the net
  #   - name: search                      # streamable-HTTP server
  #     url: http://127.0.0.1:8931/mcp
  #     allowed_tools: [search]           # optional: bridge only these tools
  connect_timeout_seconds: 15
  call_timeout_seconds: 30
# Free, keyless scientific-paper search (PubMed + arXiv). No API key needed.
literature:
  enabled: false
# Local spoken reminders/timers (no network, no OS notifications). Fires while
# Amadeus runs; missed ones announced at next startup.
reminders:
  enabled: false
  store_path: reminders.json
# Screenshot/image vision: attach a screen capture (or pasted/dropped image)
# to a chat turn. Needs a vision-capable LLM provider (gemini or openai);
# per-request and user-initiated only — images are never persisted, memory
# keeps a text marker instead.
vision:
  enabled: true
  max_image_px: 1568
  jpeg_quality: 85
  max_upload_bytes: 5000000
# "Read together" mode: the desktop pet reads a book/manga alongside you —
# the client posts one screenshot per page turn, she keeps ephemeral in-RAM
# notes for continuity and speaks only occasionally. Also needs vision.enabled
# + a vision-capable provider; the notes never touch memory or disk.
read_along:
  speak_cooldown_seconds: 90    # floor between SPOKEN lines; notes are never throttled
  max_pages_per_session: 300    # hard cap on vision LLM calls per reading session
  max_notes: 10                 # rolling continuity buffer length
  comment_max_tokens: 800       # generous for thinking models, same as screen_peek_max_tokens
# Watch together: she keeps you company while you watch/play/work — the client
# posts a screen frame every minute or so and she speaks only when something
# earns it. read_along's sibling: same vision gates, same ephemeral in-RAM
# notes, frames and reactions never persisted or committed to memory.
watch_together:
  speak_cooldown_seconds: 75    # floor between SPOKEN lines; notes are never throttled
  max_frames_per_session: 240   # hard cap on vision LLM calls per watch session
  max_notes: 8                  # rolling continuity buffer length
  comment_max_tokens: 800
# Shared-moments memory (opt-in, off by default): at the end of a read-along
# or watch-together session, one cheap-model call may distill the session's
# ephemeral notes into a single durable, recallable memory ("we watched the
# Evangelion finale together"). Everything else about co_activity stays as
# forgetful as before — frames and per-page/per-frame notes are still never
# stored; only this one closing line is, and only when enabled here.
moments:
  enabled: false
  max_chars: 200                # target length of the distilled line
  max_per_day: 3                # cap across read-along + watch-together combined
# Relational memory: at session end, one cheap-model call may record a
# single line about something that changed BETWEEN you ("we finally talked
# about why you left the lab"). The bar is a change in the relationship,
# never a summary of what happened, and SKIP is the expected answer for a
# normal conversation. Off by default: this is a first-person session-end
# record, the exact shape that once made her persona compound until she
# fixated, so the weekly cap below is a real guard rather than a knob.
# Watch memory.relational_skipped >> memory.relational_stored on /api/status.
relational_memory:
  enabled: false
  min_messages: 6               # below this, nothing could have changed
  max_per_days: 7               # cap window — deliberately NOT per-day
  max_per_period: 1
  max_chars: 200
  max_tokens: 120
  salience: 0.55                # below a co-activity moment's 0.6
# Rhythm: an opt-in two-week tally of the SHAPE of your week — how many
# late nights, how many long focus stretches, roughly which hours, and
# which coarse app category (editor/browser/terminal/chat/media/other).
# Never window titles, document names, track names, or timestamps; the
# client reduces to counters before posting, so a raw title never crosses
# the network. Gated TWICE: this flag plus a per-browser opt-in in
# Settings. Turning it off ERASES the tally. She mentions what she noticed
# at most once a week, as greeting color, never as a statistic.
# See docs/companion-ethics.md for the full contract.
rhythm:
  enabled: false
  store_path: rhythm.json
  retention_days: 14
  min_days_between_mentions: 7
# Ambient desktop awareness (desktop app): she notices cheap zero-cost
# signals — which app has been focused for hours, battery getting low, a
# track change — and reacts with at most one short line per cooldown
# (SKIP allowed; noticing often, speaking rarely). Text-only: no
# screenshots (that's the separate screen-companion opt-in in the pet
# menu) and never committed to memory.
ambient:
  enabled: true
  cooldown_seconds: 180   # < a typical song: every track is a remark opportunity
  max_tokens: 60
# Morning brief: an in-process scheduler generates one short Kurisu-voiced
# brief per day (open threads, overdue reminders, optionally one arXiv hit)
# and she delivers it in the first greeting of the day. One cheap LLM call
# per user per day; only runs while the server is up.
daily_brief:
  enabled: true   # on by default since 2026-07-28 (cheap-model calls; no-op without an API key)
  hour: 6                    # local hour the brief becomes due
  include_literature: false  # also requires literature.enabled
  max_arxiv_results: 2
  store_path: daily_brief.json
  max_tokens: 220
# Kurisu's own daily in-character diary note; folded into greetings and idle
# chatter. Same in-process scheduler as the morning brief, one cheap LLM
# call per user per day.
diary:
  enabled: true   # on by default since 2026-07-28 (cheap-model calls; no-op without an API key)
  hour: 7                    # local hour the entry becomes due
  store_path: kurisu_diary.json
  max_tokens: 180
# Nightly memory consolidation: one cheap LLM call per user per day distills
# the profile (facts, tone history, open threads) into a handful of standing
# behavioral insights — HOW to talk to you (register, pacing, boundaries),
# not what to remember — silently applied to every reply's system prompt.
# The model answers SKIP when the evidence is thin; young profiles
# (< min_sessions conversations) don't even make the call. Read-only view at
# GET /api/insights.
insights:
  enabled: true
  hour: 5                    # local hour the consolidation becomes due
  store_path: insights.json
  min_sessions: 3            # profiles younger than this skip the call
  max_tokens: 260
# Proactive reach-out: at most ONE short unprompted line per day, and only
# about an open thread you left hanging ("did the reviewer response go
# out?"). Generated by the same scheduler; delivered by voice when the app
# is visible, or through the opt-in notifications when hidden. No open
# thread, or you haven't actually been away, means she stays quiet — see
# docs/companion-ethics.md for the hard anti-neediness rules.
reach_out:
  enabled: false
  hour: 17                   # local hour after which the day's line can go out
  min_idle_hours: 8          # how long you must have been away first
  store_path: reachout.json
  max_tokens: 90
# Her sleep schedule (local hours, start inclusive → end exclusive, wraps
# midnight). While she's "asleep": no unprompted idle chatter, a pending
# reach-out waits until she wakes, pokes get a groggy half-awake reaction,
# and opening the app mid-window greets you as someone you just woke.
# Chatting normally always works — she's sleepy, not unavailable.
sleep_schedule:
  enabled: true
  start_hour: 1
  end_hour: 8
# Vocal emotion: perceives HOW your voice sounded on your last voice clip
# (energy/pitch/pace prosody), not just what you said. The STT endpoints
# analyze the same audio they transcribe; a fresh result is folded into the
# NEXT chat turn as one prompt line, never stored to memory.
#
# Judgements are RELATIVE TO YOUR OWN VOICE: the analyzer keeps an in-RAM
# rolling norm of your pitch and loudness and only speaks up when a clip
# clearly deviates from it. Until it has heard ~5 clips it stays neutral on
# purpose — vocal range differs about an octave between people, so absolute
# thresholds measure who is talking, not how they sound.
#
# mode: auto (default) and heuristic both use that path. mode: model opts
# into an ONNX speech-emotion classifier (models/vocal_emotion/, see
# scripts/fetch_vocal_emotion.py) EXCLUSIVELY. It is not the default and not
# recommended as-is: the pinned emotion2vec+ export read ordinary spoken
# lines as six different emotions with zero "neutral" at ~0.997 confidence
# when measured here, and being certain while wrong makes min_confidence
# useless as a guard. Left available for a better-calibrated model.
vocal_emotion:
  enabled: true
  mode: auto        # auto | heuristic | model
  ttl_seconds: 25
  min_confidence: 0.5
# Follow-through: when you say a real goodbye mid-something ("gotta run,
# still fighting that segfault"), a nightly job decides whether a web search
# would genuinely help with the topic you left open — most personal topics
# get an automatic SKIP — runs at most max_searches searches, and writes one
# short note grounded only in what it found. The next greeting delivers it
# once ("I read up on it — ..."). One research pass per topic, ever; needs
# web_search.enabled for the actual searches. See docs/companion-ethics.md.
follow_through:
  enabled: true   # on by default since 2026-07-28 (cheap-model calls; no-op without an API key)
  hour: 3                    # local hour after which a new topic's research runs
  max_searches: 2
  max_results_per_search: 3
  store_path: followup.json
  max_tokens: 160
# Life threads: 1-2 slow-moving pursuits of HER OWN (re-checking a paper's
# stats, a stubborn side experiment) that progress every few days and
# surface through the diary and idle chatter — so her life develops between
# conversations instead of resetting daily, and "what have YOU been up to?"
# has a real answer. At most one cheap-model call per day total; threads
# are never about you. Pairs naturally with diary.enabled.
life_threads:
  enabled: true   # on by default since 2026-07-28 (cheap-model calls; no-op without an API key)
  hour: 7                    # local hour after which the day's step becomes due
  max_active: 2
  progress_interval_days: 3  # each thread advances at most every N days
  max_progressions: 6        # steer toward an ending after this many steps
  store_path: life_threads.json
  max_tokens: 140
  # Opinion-asks: she may occasionally ask what you think about one of her
  # own pursuits, and your answer feeds the NEXT step as context (the step
  # itself still may not mention you — a progression that does is rejected
  # in code and counted as life.progress_user_leak_rejected). A pursuit is
  # asked about at most once ever, asks are weeks apart, and NOTHING
  # records whether you answered, so ignoring one costs nothing. Off by
  # default: this widens the "never involving the user" rule.
  enable_opinion_asks: false
  min_days_between_asks: 21
# Nightly conversation-quality self-check: runs a small subset of
# scripts/eval_conversation.py's scenarios (real LLM + judge calls, isolated
# tmp memory store, never your real memory) once per day, appends to a trend
# file, and flags a regression when a scenario's latest score drops well
# below its recent normal. See docs/conversation-eval.md. Off by default —
# it costs real LLM/judge calls.
self_eval:
  enabled: false
  hour: 4                    # local hour after which the day's run becomes due
  scenarios:
    - greeting_loop_no_repeat
    - in_character_consistency
    - interruption_grace
  max_calls_per_day: 10      # hard ceiling regardless of scenarios length
  trend_path: self_eval_trend.jsonl
  regression_tolerance: 2.0  # score drop vs the rolling 7-entry median
web:
  streaming_tagged_output: true
  # WebSocket /api/chat/stream endpoint — on by default. Set false to force
  # clients onto the /api/chat POST path.
  streaming_enabled: true
  # Full-duplex voice (/api/chat/duplex): continuous mic in, server-side
  # endpointing + barge-in, natural back-and-forth. Server-side ON by
  # default; each browser still opts in via Settings → Features → Full-
  # duplex voice, so this alone changes nothing.
  duplex_enabled: true
  # During duplex, she softly acknowledges sustained speech at micro-pauses
  # ("un", "hm") using the pre-rendered backchannel clips from
  # scripts/generate_fillers.py; without those clips this is a visual nod
  # only.
  duplex_backchannels: true
  # Semantic end-of-turn prediction for duplex calls (smart-turn-v3, ~8MB
  # ONNX on CPU): when your pause SOUNDS mid-thought ("so I was thinking...")
  # she waits up to duplex_smart_turn_hold_ms instead of jumping in.
  # Needs onnxruntime + the model: python scripts/fetch_smart_turn.py.
  # Without them endpointing stays energy-only (counted once in Diagnostics).
  duplex_smart_turn: true
  duplex_smart_turn_hold_ms: 2400.0
  # Inner thoughts: the model may add ONE unspoken "[thought] ..." line per
  # reply, shown as a faint ghost line — never voiced, never remembered.
  streaming_inner_thoughts: false
  # Non-verbal vocalizations: a standalone "[laugh]" / "[sigh]" line in a
  # reply plays a pre-recorded clip in her voice at exactly that point in
  # the audio stream. Inert until you generate the clips once with
  # `python scripts/generate_nonverbals.py` (see docs/voice-expressiveness.md).
  streaming_nonverbals: true
  # Variable "think delay": a short sampled pause before the first audio of a
  # streamed turn, so response timing isn't robotically constant. WS path only.
  think_delay_enabled: true
  tts_stream_workers: 1
  # Split the first sentence's speech into a short first clause + remainder
  # so playback starts sooner on slower-than-realtime TTS providers.
  streaming_first_clause_split: true
  # Use the TTS provider's sub-sentence streaming synthesis API (if it has
  # one, e.g. qwen3_tts's faster engine) instead of one blocking call per
  # sentence, so audio starts playing after the first ~1s chunk. Falls back
  # automatically for providers without streaming support. When both this
  # and streaming_first_clause_split are enabled, chunked synthesis takes
  # priority for chunk-capable providers (the clause split becomes redundant).
  streaming_chunked_tts: true
  # Merge sentences shorter than this many chars into the next TTS unit —
  # short interjections are where the zero-shot clone most often drifts to
  # a different-sounding voice. 0 disables; sentence 1 is never held.
  # (Superseded while streaming_tts_full_reply is on.)
  streaming_tts_min_unit_chars: 24
  # Synthesize the whole reply as ONE zero-shot generation instead of one
  # per sentence, removing the voice-reset boundaries where the clone can
  # drift to a different speaker mid-reply. Audio starts once the LLM
  # finishes the reply (chunked synthesis still streams the audio out), so
  # this costs roughly the LLM tail in first-audio latency in exchange for
  # a stable voice.
  streaming_tts_full_reply: true
  # Full-reply mode safety cap: split replies longer than this many chars
  # into multiple units at sentence boundaries (very long generations slow
  # Qwen3 disproportionately). Typical replies stay a single unit. 0 = off.
  streaming_tts_max_unit_chars: 360
  # Optional bearer-token auth for every /api/* route. null (default) keeps
  # the API open — exactly the pre-auth local behavior. When set, requests
  # need "Authorization: Bearer <token>", and the /api/chat/stream WebSocket
  # takes it as ?token=<token>. Env fallback: AMADEUS_API_TOKEN. /healthz
  # and static/SPA routes always stay open.
  api_token: null
  # Origins allowed by CORS. Default is the historical wildcard; set explicit
  # origins (e.g. ["https://kurisu.example.com"]) for shared deployments.
  cors_origins: ["*"]
  # Public-demo hardening (see docs/hosted-demo.md). demo_mode locks every
  # settings/persona mutation endpoint (403) and hides those controls in the
  # UI; rate_limit_per_minute caps chat/TTS/STT turns per client IP in a
  # sliding 60s window (null = off; demo_mode defaults it to 10).
  demo_mode: false
  rate_limit_per_minute: null
# Local wake word (WS /api/wake): say the wake phrase and she starts a duplex
# call — no button. Detection runs entirely locally (openwakeword ONNX);
# audio is never stored and never leaves the machine. Default OFF (an
# always-on mic is a privacy opt-in), and each browser must ALSO enable
# Settings → Features → Wake word. Needs the [wake] extra plus a model:
# python scripts/fetch_wake_word.py (default phrase "hey jarvis"; drop a
# custom-trained .onnx into models/wake_word/ for your own phrase).
wake_word:
  enabled: false
  # Explicit .onnx path; null = first model found in models/wake_word/.
  model: null
  threshold: 0.5
  refractory_seconds: 2.0
