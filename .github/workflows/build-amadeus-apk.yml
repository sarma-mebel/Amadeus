name: Build Amadeus APK
on:
  push:
    branches: [build/amadeus-android-apk]
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build web client
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync android
      - name: Build and verify signed APK
        working-directory: frontend/android
        run: |
          bash ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Amadeus.apk"
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$signer" verify --verbose "$GITHUB_WORKSPACE/Amadeus.apk"
          sha256sum "$GITHUB_WORKSPACE/Amadeus.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: amadeus-android
          path: Amadeus.apk
          if-no-files-found: error
