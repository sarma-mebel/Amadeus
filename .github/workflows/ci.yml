name: CI

on:
  push:
    branches: [main, "feat/**"]
    # Docs-only commits don't need a test run; keep the free-tier minutes
    # for code changes (Windows release builds already bill at 2x).
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"

# Rapid consecutive pushes used to stack duplicate runs (three identical
# runs for one minute of pushes on 2026-07-16); only the newest matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # 3.10 to match the real dev env (conda `amadeus`, 3.10.19) — CI
          # green on a version dev doesn't run is a false signal.
          python-version: "3.10"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web]" pytest pytest-asyncio ruff
      - name: Secret scan
        run: python scripts/check_secrets.py --all
      - name: Ruff
        run: ruff check amadeus/
      - name: Tests
        # Collection scope and heavy-dep ignores live in pyproject's
        # [tool.pytest.ini_options]. NEVER run `make eval` here: it makes
        # live LLM calls and needs provider keys this workflow deliberately
        # doesn't have.
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        # `tsc -b && vite build` — the build IS the typecheck.
        run: npm run build
      - name: Tests
        # Drop-guard wrapper (scripts/run-tests.mjs): verifies every
        # discovered test file actually ran — plain `vitest run` can drop
        # files on worker-startup timeouts while still exiting 0.
        run: npm run test:ci
