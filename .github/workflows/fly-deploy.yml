# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# Manual-only: FLY_API_TOKEN was never configured, so the old on-push trigger
# just added a failing run to every push to main. Trigger from the Actions tab
# (after setting the secret) if a Fly deploy is ever actually wanted.

name: Fly Deploy
on:
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
